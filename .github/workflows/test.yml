name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests + oracle bite-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (no API keys required)
        # tests/ uses FakeChatModel — zero real LLM calls.
        run: pytest tests/ -v --tb=short

      - name: Oracle bite-check (no API keys required)
        # Runs every benchmark oracle against its own UNMIGRATED source_py2.py,
        # each case in its own temp dir. Every oracle must FAIL there; one that
        # passes isn't testing its trap. Exits 1 if any case passes.
        run: python -m benchmark.bite_check

  # Full benchmark runs (claude-*, gemini-*) are intentionally NOT in CI.
  # They require paid API keys, take ~5 minutes, and are run manually as
  # measurement events — not on every commit. See README.md (Under the hood).
